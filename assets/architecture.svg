<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00D26A"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7075"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="1060" rx="18" fill="#1B1C1E" stroke="#33363A" stroke-width="1.5"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">

    <!-- Agent -->
    <rect x="210" y="56" width="340" height="66" rx="33" fill="#1F2A24" stroke="#00D26A" stroke-width="2"/>
    <text x="380" y="84" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="bold">Trae Agent（AI）</text>
    <text x="380" y="105" text-anchor="middle" fill="#9AA0A6" font-size="12.5">选择 Skill 与 MCP 工具</text>

    <line x1="380" y1="122" x2="380" y2="170" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="134" width="188" height="22" rx="11" fill="#242628"/>
    <text x="486" y="149" text-anchor="middle" fill="#C8CDD2" font-size="12">① MCP 工具（4 个）</text>

    <!-- MCP plugin container -->
    <rect x="60" y="170" width="640" height="250" rx="12" fill="none" stroke="#4B4F52" stroke-width="1.3" stroke-dasharray="7 6"/>
    <text x="80" y="195" fill="#8A8F94" font-size="13">MCP 插件 trae-java-navigator（skills + mcp）</text>

    <rect x="90" y="212" width="360" height="180" rx="10" fill="#1D2A23" stroke="#00D26A" stroke-width="2"/>
    <text x="110" y="239" fill="#FFFFFF" font-size="15.5" font-weight="bold">MCP Server（Node，stdio）</text>
    <text x="110" y="264" fill="#C8CDD2" font-size="12.5">java_search · java_navigate</text>
    <text x="110" y="284" fill="#C8CDD2" font-size="12.5">java_diagnostics · java_status</text>
    <text x="110" y="310" fill="#9AA0A6" font-size="12.5">bridge-client 优先 / lsp-client 兜底</text>
    <text x="110" y="330" fill="#9AA0A6" font-size="12.5">workspace 延迟解析；结果带 summary</text>
    <text x="110" y="350" fill="#9AA0A6" font-size="12.5">只读：不改源码、不触发构建</text>
    <text x="110" y="374" fill="#7FD3A2" font-size="12.5">SKILL java-navigate：触发与使用规范</text>

    <rect x="480" y="222" width="200" height="160" rx="10" fill="#1A1B1D" stroke="#6B7075" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="498" y="249" fill="#D0D5DA" font-size="14" font-weight="bold">独立 JDT LS（兜底）</text>
    <text x="498" y="272" fill="#9AA0A6" font-size="12">source: standalone-jdtls</text>
    <text x="498" y="292" fill="#9AA0A6" font-size="12">复用 redhat.java server</text>
    <text x="498" y="312" fill="#9AA0A6" font-size="12">+ 自带 JRE</text>
    <text x="498" y="332" fill="#9AA0A6" font-size="12">缓存写系统临时目录（%TEMP%）</text>
    <text x="498" y="356" fill="#777C80" font-size="12">桥接不可用时自动启用</text>

    <line x1="450" y1="285" x2="478" y2="285" stroke="#6B7075" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowGrey)"/>

    <!-- HTTP -->
    <line x1="380" y1="420" x2="380" y2="488" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="438" width="298" height="22" rx="11" fill="#242628"/>
    <text x="541" y="453" text-anchor="middle" fill="#C8CDD2" font-size="12">② HTTP 127.0.0.1:&lt;port&gt; + Bearer token</text>

    <!-- IDE container -->
    <rect x="60" y="488" width="640" height="400" rx="12" fill="none" stroke="#4B4F52" stroke-width="1.3" stroke-dasharray="7 6"/>
    <text x="80" y="513" fill="#8A8F94" font-size="13">Trae IDE（VS Code 内核）</text>

    <rect x="90" y="528" width="580" height="116" rx="10" fill="#1D2A23" stroke="#00D26A" stroke-width="2"/>
    <text x="110" y="555" fill="#FFFFFF" font-size="15.5" font-weight="bold">trae-java-bridge 扩展</text>
    <text x="110" y="580" fill="#C8CDD2" font-size="12.5">HTTP → vscode.commands / vscode.languages</text>
    <text x="110" y="601" fill="#9AA0A6" font-size="12">状态栏 / 通知面板 / 设置 enabled · port · timeout</text>
    <text x="110" y="621" fill="#9AA0A6" font-size="12">多窗口按 pid 隔离；空窗口不写桥接文件</text>
    <rect x="600" y="538" width="56" height="22" rx="11" fill="#00D26A"/>
    <text x="628" y="553" text-anchor="middle" fill="#10241A" font-size="12" font-weight="bold">推荐</text>

    <line x1="380" y1="644" x2="380" y2="692" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="657" width="120" height="22" rx="11" fill="#242628"/>
    <text x="452" y="672" text-anchor="middle" fill="#C8CDD2" font-size="12">③ vscode API</text>

    <rect x="90" y="692" width="580" height="76" rx="10" fill="#202124" stroke="#3A3D40" stroke-width="1.5"/>
    <text x="110" y="720" fill="#E6E8EA" font-size="14.5" font-weight="bold">redhat.java 扩展</text>
    <text x="110" y="742" fill="#9AA0A6" font-size="12.5">JDT LS 客户端 · Problems · 实时诊断</text>

    <line x1="380" y1="768" x2="380" y2="812" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="779" width="112" height="22" rx="11" fill="#242628"/>
    <text x="448" y="794" text-anchor="middle" fill="#C8CDD2" font-size="12">④ stdio LSP</text>

    <rect x="90" y="812" width="580" height="60" rx="10" fill="#202124" stroke="#3A3D40" stroke-width="1.5"/>
    <text x="110" y="838" fill="#E6E8EA" font-size="14.5" font-weight="bold">IDE JDT LS（redhat.java 自带 JRE）</text>
    <text x="110" y="858" fill="#9AA0A6" font-size="12.5">索引 / 编译诊断 / 定义 / 引用</text>

    <!-- Workspace -->
    <rect x="60" y="904" width="640" height="96" rx="12" fill="none" stroke="#4B4F52" stroke-width="1.3" stroke-dasharray="7 6"/>
    <text x="80" y="928" fill="#8A8F94" font-size="13">工作区与运行态数据</text>
    <text x="80" y="951" fill="#C8CDD2" font-size="12.5">项目源码 · Maven 依赖（只读，不写入工程目录）</text>
    <text x="80" y="972" fill="#9AA0A6" font-size="12">桥接文件：%TEMP%\trae-java-bridge\&lt;hash&gt;-&lt;pid&gt;.json（token 仅本机）</text>
    <text x="80" y="991" fill="#9AA0A6" font-size="12">兜底缓存：%TEMP%\trae-java-navigator\（Eclipse 元数据也在此）</text>

    <!-- Legend -->
    <line x1="70" y1="1028" x2="130" y2="1028" stroke="#00D26A" stroke-width="3"/>
    <text x="140" y="1032" fill="#D0D5DA" font-size="12.5">IDE 桥接（优先，复用 IDE JDT LS）</text>
    <line x1="400" y1="1028" x2="460" y2="1028" stroke="#6B7075" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="470" y="1032" fill="#D0D5DA" font-size="12.5">独立 JDT LS（兜底，单独索引）</text>
  </g>
</svg>